services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobayer-portfolio-web
    restart: unless-stopped
    environment:
      PORT: 4200
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5050}
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1,portfolio-web,*"
    ports:
      - "4200:4200"

