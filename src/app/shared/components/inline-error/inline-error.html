<div
  role="alert"
  class="surface-card flex flex-col sm:flex-row items-center justify-between gap-4 p-4 border"
  style="border-color: rgba(239, 68, 68, 0.4); background-color: var(--color-surface)"
>
  <div class="flex items-center gap-3">
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
      style="background-color: var(--color-error-bg); color: var(--color-error)"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
    </div>
    <p class="text-sm text-slate-300">{{ message() }}</p>
  </div>
  <button type="button" (click)="retry.emit()" class="btn-secondary text-xs shrink-0">Retry</button>
</div>
