<div class="max-w-3xl mb-12">
  @if (eyebrow()) {
    <span class="text-xs font-mono uppercase tracking-wider text-indigo-400">
      {{ eyebrow() }}
    </span>
  }
  <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mt-2">
    {{ title() }}
  </h1>
  @if (description()) {
    <p class="mt-4 text-lg text-slate-400 leading-relaxed">
      {{ description() }}
    </p>
  }
</div>
